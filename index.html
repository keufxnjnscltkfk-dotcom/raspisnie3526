<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Расписание 3526</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#101018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101018;
    --bg2:#17161f;
    --card:#1c1b26;
    --ink:#f4f2ff;
    --muted:#9490ab;
    --odd:#ff4d6d;
    --odd-soft:rgba(255,77,109,.14);
    --odd-soft2:rgba(255,77,109,.28);
    --even:#4fb4ff;
    --even-soft:rgba(79,180,255,.14);
    --even-soft2:rgba(79,180,255,.28);
    --line:#2a2836;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% -10%, rgba(255,77,109,.16), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(79,180,255,.14), transparent 40%);
    background-repeat:no-repeat;
    background-position:top left, top right;
    background-size:100vw 100vh, 100vw 100vh;
    background-attachment:fixed, fixed;
    color:var(--ink);
    font-family:"Manrope",-apple-system,sans-serif;
    padding:calc(26px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:680px;margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
  }
  .htext h1{
    font-family:"Unbounded",sans-serif;
    font-weight:900;
    font-size:1.5rem;
    margin:0 0 6px;
    line-height:1.05;
    letter-spacing:-.5px;
  }
  .htext h1 span{
    background:linear-gradient(90deg,var(--odd),var(--even));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  #meta{
    font-size:.85rem;
    color:var(--muted);
    font-weight:600;
  }
  #meta b{color:var(--ink);}
  #meta .clock{
    color:var(--ink);
    font-family:"Unbounded",sans-serif;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  #nextPairBlock{margin-bottom:22px;}
  #nextPairBlock .next-label{
    font-family:"Unbounded",sans-serif;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:8px;
  }
  #nextPairBlock .next-label b{color:var(--ink);}
  .mascot{
    flex:0 0 auto;
    height:96px;
    width:auto;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
    transform:rotate(-4deg);
  }

  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:24px;
  }
  .tabs button{
    flex:1 1 100px;
    font-family:"Unbounded",sans-serif;
    font-size:.78rem;
    font-weight:700;
    padding:15px 8px;
    min-height:48px;
    border:none;
    border-radius:14px;
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
    transition:.15s;
    border:1.5px solid var(--line);
    touch-action:manipulation;
  }
  .tabs button.active{
    background:linear-gradient(120deg,var(--odd),var(--even));
    color:#fff;
    border-color:transparent;
  }
  .tabs button:not(.active):hover{
    border-color:#3d3a4d;
    color:var(--ink);
  }

  .day-block{margin-bottom:28px;}
  .day-title{
    font-family:"Unbounded",sans-serif;
    font-size:1.05rem;
    font-weight:700;
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .tag{
    font-family:"Manrope",sans-serif;
    font-size:.66rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    padding:4px 9px;
    border-radius:20px;
    background:var(--line);
    color:var(--muted);
  }
  .tag.odd{ background:var(--odd-soft2); color:#ffb3c1; }
  .tag.even{ background:var(--even-soft2); color:#bfe4ff; }
  .pair-time .tag{
    display:inline-block;
    margin-left:6px;
    vertical-align:middle;
    font-size:.6rem;
    padding:3px 8px;
  }

  .day-sub{
    font-size:.8rem;
    color:var(--muted);
    margin-bottom:12px;
    font-weight:600;
  }

  .empty{
    padding:18px 18px;
    border:1.5px dashed var(--line);
    border-radius:16px;
    color:var(--muted);
    font-weight:700;
    font-size:.95rem;
    text-align:center;
  }

  .pair{
    position:relative;
    background:var(--card);
    padding:14px 16px 14px 18px;
    margin-bottom:11px;
    border-radius:16px;
    border:1.5px solid var(--line);
    overflow:hidden;
  }
  .pair::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
  }
  .pair.odd{ background:linear-gradient(120deg, var(--odd-soft), var(--card) 55%); }
  .pair.odd::before{ background:var(--odd); }
  .pair.even{ background:linear-gradient(120deg, var(--even-soft), var(--card) 55%); }
  .pair.even::before{ background:var(--even); }
  .pair.both::before{ background:var(--line); }

  .pair-time{
    font-size:.75rem;
    color:var(--muted);
    font-weight:800;
    margin-bottom:4px;
    letter-spacing:.2px;
  }
  .pair-subject{
    font-size:1rem;
    font-weight:800;
    margin-bottom:2px;
    line-height:1.25;
  }
  .pair-type{
    font-size:.78rem;
    color:var(--muted);
    font-weight:600;
    margin-bottom:6px;
  }
  .pair-detail{
    font-size:.78rem;
    color:var(--muted);
    line-height:1.55;
  }

  footer{
    margin-top:34px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:.72rem;
    color:var(--muted);
    text-align:center;
    font-weight:600;
  }

  .predict-btn-wrap{
    margin-top:30px;
    text-align:center;
  }
  #btnPredict{
    font-family:"Unbounded",sans-serif;
    font-size:.85rem;
    font-weight:700;
    padding:15px 26px;
    border:none;
    border-radius:16px;
    background:linear-gradient(120deg,var(--odd),var(--even));
    color:#fff;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,77,109,.25);
    touch-action:manipulation;
  }
  #btnPredict:active{ transform:scale(.97); }

  .predict-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,9,14,.92);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
  }
  .predict-overlay.show{ display:flex; }
  .predict-card{
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .predict-mascot{
    height:150px;
    width:auto;
    margin:0 auto 18px;
    display:block;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));
  }
  .predict-status{
    font-family:"Unbounded",sans-serif;
    font-weight:700;
    font-size:1rem;
    margin-bottom:16px;
    color:var(--ink);
  }
  .predict-bar-track{
    width:100%;
    height:10px;
    border-radius:6px;
    background:var(--card);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:22px;
  }
  .predict-bar-fill{
    height:100%;
    width:0%;
    border-radius:6px;
    background:linear-gradient(90deg,var(--odd),var(--even));
  }
  .predict-result{
    font-size:1.05rem;
    font-weight:800;
    line-height:1.5;
    margin-bottom:22px;
    display:none;
  }
  .predict-close{
    font-family:"Unbounded",sans-serif;
    font-size:.8rem;
    font-weight:700;
    padding:12px 24px;
    border:none;
    border-radius:14px;
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--ink);
    cursor:pointer;
    display:none;
  }
</style>
</head>

const dayOrder = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];

/* ---------- Логика даты и чётности ---------- */
const REF_MONDAY = new Date(2026, 7, 31);

function mondayOf(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d;
}

function isOddWeek(date){
  const mon = mondayOf(date);
  const refMon = mondayOf(REF_MONDAY);
  const diffWeeks = Math.round((mon - refMon) / (7*86400000));
  const mod = ((diffWeeks % 2) + 2) % 2;
  return mod === 0;
}

function ruDayName(date){
  const idx = date.getDay();
  const map = [6,0,1,2,3,4,5];
  return dayOrder[map[idx]];
}

function formatDate(date){
  return date.toLocaleDateString("ru-RU", {day:"numeric", month:"long", weekday:"long"});
}

/* ---------- Рендер ---------- */
function renderPairs(dayName, parityOdd){
  const pairs = schedule[dayName] || [];
  const visible = [];
  pairs.forEach(p=>{
    p.items.forEach(it=>{
      if(it.parity === "both" ||
         (it.parity === "odd" && parityOdd) ||
         (it.parity === "even" && !parityOdd)){
        visible.push({time:p.time, ...it});
      }
    });
  });
  if(visible.length === 0){
    return '<div class="empty">Сегодня пар нет, ура :3</div>';
  }
  return visible.map(it => `
    <div class="pair ${it.parity}">
      <div class="pair-time">${it.time}</div>
      <div class="pair-subject">${it.subject}</div>
      <div class="pair-type">${it.type}</div>
      <div class="pair-detail">${it.detail}</div>
    </div>
  `).join("");
}

function renderAllPairs(dayName){
  const pairs = schedule[dayName] || [];
  const visible = [];
  pairs.forEach(p=>{
    p.items.forEach(it=>{
      visible.push({time:p.time, ...it});
    });
  });
  if(visible.length === 0){
    return '<div class="empty">Сегодня пар нет, ура :3</div>';
  }
  return visible.map(it => `
    <div class="pair ${it.parity}">
      <div class="pair-time">${it.time} <span class="tag ${it.parity==='odd'?'odd':it.parity==='even'?'even':''}">${it.parity==='odd'?'нечётная':it.parity==='even'?'чётная':'кажд. неделя'}</span></div>
      <div class="pair-subject">${it.subject}</div>
      <div class="pair-type">${it.type}</div>
      <div class="pair-detail">${it.detail}</div>
    </div>
  `).join("");
}

function allDayBlock(dayName){
  return `
    <div class="day-block">
      <div class="day-title">${dayName}</div>
      ${renderAllPairs(dayName)}
    </div>
  `;
}

  let html = "";
  dayOrder.forEach(dayName=>{

function dayBlock(date){
  const dayName = ruDayName(date);
  const parityOdd = isOddWeek(date);
  return `
    <div class="day-block">
      <div class="day-title">${dayName} <span class="tag ${parityOdd?'odd':'even'}">${parityOdd ? "нечётная" : "чётная"}</span></div>
      <div class="day-sub">${formatDate(date)}</div>
      ${renderPairs(dayName, parityOdd)}
    </div>
  `;
}

function renderToday(){
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate()+1);
  document.getElementById("content").innerHTML = dayBlock(today) + dayBlock(tomorrow);
}

function renderWeek(){
  const today = new Date();
  const mon = mondayOf(today);
  let html = "";
  for(let i=0;i<7;i++){
    const d = new Date(mon);
    d.setDate(mon.getDate()+i);
    html += dayBlock(d);
  }
  document.getElementById("content").innerHTML = html;
}

function updateMeta(){
  const today = new Date();
  const parityOdd = isOddWeek(today);
  const hh = String(today.getHours()).padStart(2,"0");
  const mm = String(today.getMinutes()).padStart(2,"0");
  document.getElementById("meta").innerHTML =
    `${formatDate(today)} · неделя <b>${parityOdd ? "нечётная" : "чётная"}</b> · <span class="clock">${hh}:${mm}</span>`;
}

function findNextPair(){
  const now = new Date();
  for(let offset=0; offset<=7; offset++){
    const date = new Date(now);
    date.setDate(now.getDate()+offset);
    const dayName = ruDayName(date);
    const parityOdd = isOddWeek(date);
    const pairs = schedule[dayName] || [];
    const candidates = [];
    pairs.forEach(p=>{
      const m = p.time.match(/(\d{2}):(\d{2})—/);
      if(!m) return;
      const start = new Date(date);
      start.setHours(parseInt(m[1],10), parseInt(m[2],10), 0, 0);
      p.items.forEach(it=>{
        if(it.parity === "both" ||
           (it.parity === "odd" && parityOdd) ||
           (it.parity === "even" && !parityOdd)){
          if(start > now){
            candidates.push({start, time:p.time, ...it});
          }
        }
      });
    });
    candidates.sort((a,b)=>a.start-b.start);
    if(candidates.length){
      return candidates[0];
    }
  }
  return null;
}

function formatCountdown(ms){
  const totalMin = Math.max(0, Math.round(ms/60000));
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if(days) parts.push(`${days} д`);
  if(hours) parts.push(`${hours} ч`);
  if(mins || parts.length === 0) parts.push(`${mins} мин`);
  return parts.join(" ");
}

function renderNextPair(){
  const el = document.getElementById("nextPairBlock");
  const next = findNextPair();
  if(!next){
    el.innerHTML = "";
    return;
  }
  const now = new Date();
  const countdown = formatCountdown(next.start - now);
  el.innerHTML = `
    <div class="next-label">Ближайшая пара — через <b>${countdown}</b></div>
    <div class="pair ${next.parity}">
      <div class="pair-time">${next.time}</div>
      <div class="pair-subject">${next.subject}</div>
      <div class="pair-type">${next.type}</div>
      <div class="pair-detail">${next.detail}</div>
    </div>
  `;
}

const btnToday = document.getElementById("btnToday");
const btnWeek = document.getElementById("btnWeek");
const btnAll = document.getElementById("btnAll");
const tabButtons = [btnToday, btnWeek, btnAll];

function setActive(btn){
  tabButtons.forEach(b=>b.classList.toggle("active", b===btn));
}

btnToday.addEventListener("click", ()=>{
  setActive(btnToday);
  renderToday();
});
btnWeek.addEventListener("click", ()=>{
  setActive(btnWeek);
  renderWeek();
});
btnAll.addEventListener("click", ()=>{
  setActive(btnAll);
  renderAll();
});

updateMeta();
renderNextPair();
renderToday();
setInterval(()=>{
  updateMeta();
  renderNextPair();
}, 30000);

let predictOverlayEl, predictBarEl, predictStatusEl, predictResultEl, predictCloseEl;

function initPredictOverlay(){
  if(predictOverlayEl) return;
  predictOverlayEl = document.getElementById("predictOverlay");
  predictBarEl = document.getElementById("predictBar");
  predictStatusEl = document.getElementById("predictStatus");
  predictResultEl = document.getElementById("predictResult");
  predictCloseEl = document.getElementById("predictClose");
  predictCloseEl.addEventListener("click", ()=>{
    predictOverlayEl.classList.remove("show");
  });
}

function pickPrediction(){
  const all = predictionsStudy.concat(predictionsLife, predictionsGuap);
  return all[Math.floor(Math.random() * all.length)];
}

function startPrediction(){
  initPredictOverlay();
  predictStatusEl.textContent = "Генерация предсказания...";
  predictStatusEl.style.display = "block";
  predictBarEl.parentElement.style.display = "block";
  predictBarEl.style.width = "0%";
  predictResultEl.style.display = "none";
  predictResultEl.textContent = "";
  predictCloseEl.style.display = "none";
  predictOverlayEl.classList.add("show");

  const totalDuration = 5000 + Math.random() * 10000; // 5-15 сек
  const startTime = performance.now();
  let progress = 0;

  function tick(now){
    const elapsed = now - startTime;
    const targetByTime = Math.min(100, (elapsed / totalDuration) * 100);
    const jitter = (Math.random() - 0.3) * 9; // рывки то быстрее то медленнее
    progress = Math.max(progress, Math.min(targetByTime, progress + Math.max(0.3, jitter)));
    progress = Math.min(progress, 99);
    predictBarEl.style.width = progress + "%";

    if(elapsed < totalDuration){
      requestAnimationFrame(tick);
    } else {
      predictBarEl.style.width = "100%";
      setTimeout(()=>{
        predictStatusEl.style.display = "none";
        predictBarEl.parentElement.style.display = "none";
        predictResultEl.textContent = pickPrediction();
        predictResultEl.style.display = "block";
        predictCloseEl.style.display = "inline-block";
      }, 200);
    }
  }
  requestAnimationFrame(tick);
}
</script>
